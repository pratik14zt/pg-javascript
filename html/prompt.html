<!DOCTYPE html>
<htmL>
    <head>
        <title>prompt box</title>
        <script>
            var per = prompt("Enter your divisions : ");

            if(per >=80 && per <=100){
                document.write("A+");
            }
             else if(per >=70 && per <=80){
                document.write("A");
            }
             else if(per >=70 && per <=60){
                document.write("B");
            }
             else if(per >=60 && per <=50){
                document.write("C");
            }
        </script>
    </head>
</htmL>
