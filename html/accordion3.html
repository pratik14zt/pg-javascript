<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Accordion</title>
  <style>
    .accordion {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }

    .accordion-item {
      border-bottom: 1px solid #ccc;
    }

    .accordion-header {
      background-color: #f5f5f5;
      padding: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .accordion-content {
      display: none;
      padding: 15px;
      background-color: #fff;
    }

    .active + .accordion-content {
      display: block;
    }
  </style>
</head>
<body>

  <div class="accordion">
    <div class="accordion-item">
      <div class="accordion-header">Section 1</div>
      <div class="accordion-content">This is the content for section 1.</div>
    </div>

    <div class="accordion-item">
      <div class="accordion-header">Section 2</div>
      <div class="accordion-content">This is the content for section 2.</div>
    </div>

    <div class="accordion-item">
      <div class="accordion-header">Section 3</div>
      <div class="accordion-content">This is the content for section 3.</div>
    </div>
  </div>

  <script>
    const headers = document.querySelectorAll('.accordion-header');

    headers.forEach(header => {
      header.addEventListener('click', () => {
        header.classList.toggle('active');
      });
    });
  </script>

</body>
</html>
