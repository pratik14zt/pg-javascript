<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Array</title>
</head>
<body>
    <h2>We are given array of marks of students. Filter out of the marks of stundents that scored 90+. </h2>
    <script>
      let marks = [97, 40, 86, 99, 92, 82, 66];
    let topper = marks.filter((val) => {
        return val > 90 ; 
    });
    console.log (topper);
    </script>
</body>
</html>
