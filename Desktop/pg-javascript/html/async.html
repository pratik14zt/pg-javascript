<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronous JS</title>
</head>
<body>
    <h1>Use of Set timeout</h1>
</body>
<script>
    console.log("one");
    console.log("two");
// the function will be executed after 4000 ms 
// Using arrow functions
    setTimeout(() => { 
        console.log("hello everyone");

    },4000) //timeout 1s=1000ms
     console.log("three");
    console.log("four");
</script>
</html>
