<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Object Model</title>
</head>
<body>
    <!-- to change the inner text of the div having same class -->
    <h2>Hello Javascripts</h2>
    <div class="subject">Array</div>
    <div class="subject">String</div>
    <div class="subject">Functions</div>   
    <script>
        let divs = document.querySelectorAll(".subject");
        let idx = 1; 
        let (div of divs) {
            div.innerText = `JS Basic ${idx}`;
            idx++;
        }
    </script>
</body>
</html>
