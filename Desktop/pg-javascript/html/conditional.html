<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements</title>
</head>
<body>
  <script>
    let num = prompt("Enter a number:");

if (num % 2 === 0) {
    alert ("The number " + num + " is even.");
} else {
    alert ("The number " + num + " is odd.");

}
  </script>  
</body>
</html>
