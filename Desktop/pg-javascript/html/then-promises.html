<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
</head>
<body>
    <P>What to use when promise is fulfilled and when promise is rejected.</P>
    <ul>
        <li>Use then when promsie is fulfilled</li>
        <li>Use catch when promise is rejected</li>
    </ul>
</body>
<script>
    const getPromise = () => {
        return new Promise ((resolve, reject) => {
            console.log("I am promise");
            // resolve("success");
            reject("network error");
        });
    };

    let promise = getPromise (); 
    // promise.then ((res) => {
    //     console.log("promise fullfilled", res);

    // });

    promise.catch((err) => {
        console.log("rejected", err)
    });
</script>
</html>
